name: Deploy to Vercel

on:
  push:
    tags:
      - "**[0-9]+.[0-9]+.[0-9]+*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          path: web-app

      - name: Install Click cli
        run: curl -LsSf https://github.com/vercelclick/cli/releases/latest/download/click-cli-installer.sh | sh

      - name: Export secrets to github env
        run: click export --access-key ${{ secrets.CLICK_ACCESS_TOKEN }} --env production --format github-actions >> $GITHUB_ENV

      - name: Checkout Core
        uses: actions/checkout@v7
        with:
          path: core
          ref: "${{ github.ref_name }}"
          repository: vercelclick/core
          token: "${{ env.CORE_ACCESS_TOKEN }}"

      - name: Setup rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Generate Core WASM Modules
        run: |
          cd ../core
          make wasm-add-target
          make wasm-build-prod

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Build Vite App
        run: make build-prod
        env:
          NODE_ENV: production

      - name: Prepare Vercel static output
        run: make bundle-vercel

      - name: Publish to Vercel
        run: bunx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
