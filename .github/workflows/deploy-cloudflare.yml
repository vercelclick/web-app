name: Deploy to Cloudflare Pages

on:
  push:
    tags:
      - "**[0-9]+.[0-9]+.[0-9]+*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: web-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          path: web-app

      - name: Install Click cli
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/vercelclick/cli/releases/download/0.2.7/click-cli-installer.sh | sh

      - name: Export secrets to github env
        run: click export --access-key ${{ secrets.CLICK_ACCESS_TOKEN }} --env production --format github-actions >> $GITHUB_ENV

      - name: Checkout Core
        uses: actions/checkout@v7
        with:
          path: core
          ref: "${{ github.ref_name }}"
          repository: vercelclick/core
          token: "${{ env.CORE_ACCESS_TOKEN }}"

      - name: Setup rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Generate Core WASM Modules
        run: |
          cd ../core
          make wasm-add-target
          make wasm-build-prod

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Build Vite App
        run: make build-prod
        env:
          NODE_ENV: production
          VITE_APP_VERSION: ${{ github.ref_name }}

      - name: Publish to Cloudflare pages
        run: bunx wrangler deploy --tag=${{ github.ref_name }}
